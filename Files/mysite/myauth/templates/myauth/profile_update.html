{% extends 'myauth/base.html' %}

{% block title %}
  Update profile
{% endblock %}

{% block body %}
    <h1>Update profile: {{ object.user.username }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'myauth:user-detail' object.user.pk %}">Back to profile</a></p>
{% endblock %}
